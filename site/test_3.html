<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="test.css">
    <style>
        .lol {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 55px;
            width: 55px;
            background-color: black;
            border-radius: 50%;
        }

        .smooth-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 20px;
            width: 20px;
            background-color: greenyellow;
            border-radius: 50%;
            transition: transform 2s linear;
        }
    </style>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
</head>
<body>
    <div class="tempdisplay" id="dialogue-box">
        <h1>Test 3/5: Smooth Movement</h1>
        <p class="error">
            A green dot will smoothly move around the page. Please use your eyes to follow the green dot’s movement.
            <br><br>一個綠點將平滑地在頁面上移動。 請用眼睛跟隨綠點的移動。
        </p>
        <div class="buttons">
            <button class="invis">This is placeholder</button>
            <button class="yea" onclick="startTest();">Continue</button>
        </div>
    </div>
    <div class="lol" id="test-container" style="display: none;">
        <div class="center-dot"></div>
        <div class="smooth-dot" id="green-dot"></div>
    </div>

    <script>
        const greenDot = document.getElementById("green-dot");
        const dialogueBox = document.getElementById("dialogue-box");
        const testContainer = document.getElementById("test-container");
        let counter = 999;
        let dx = 1;
        let dy = 1;

        function moveSmoothly() {
            if (counter === 0) {
                dialogueBox.style.display = "block";
                dialogueBox.getElementsByClassName('error')[0].textContent = "This test has finished. Click Continue to go to the next test.";
                dialogueBox.getElementsByClassName("yea")[0].textContent = "Continue";
                dialogueBox.getElementsByClassName("yea")[0].onclick = function () { location.href = "test_4.html"; };
            }

            const radius = Math.min(window.innerWidth, window.innerHeight) * 0.4;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            let targetX = parseFloat(greenDot.style.left);
            let targetY = parseFloat(greenDot.style.top);

            if (isNaN(targetX) || isNaN(targetY)) {
                targetX = centerX;
                targetY = centerY;
            }

            targetX += dx;
            targetY += dy;

            const dotSize = parseInt(getComputedStyle(greenDot).width) / 2;
            const minX = dotSize;
            const minY = dotSize;
            const maxX = window.innerWidth - dotSize;
            const maxY = window.innerHeight - dotSize;

            if (targetX < minX || targetX > maxX) {
                dx *= -1;
                targetX = Math.max(minX, Math.min(targetX, maxX));
            }

            if (targetY < minY || targetY > maxY) {
                dy *= -1;
                targetY = Math.max(minY, Math.min(targetY, maxY));
            }

            greenDot.style.transform = `translate(${targetX}px, ${targetY}px)`;

            setTimeout(moveSmoothly, 10);
            counter -= 1;
        }

        function startTest() {
            dialogueBox.style.display = "none";
            testContainer.style.display = "block";
            moveSmoothly();
        }

    </script>
</body>
</html>
