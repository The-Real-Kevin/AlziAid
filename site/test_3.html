<!DOCTYPE html>
<html>
    <body>
        <script class="test3">
            lol = true;
            greenDot = document.createElement("div");
            greenDot.classList.add("test3");
            greenDot.style.position = "absolute";
            greenDot.style.width = "20px";
            greenDot.style.height = "20px";
            greenDot.style.backgroundColor = "green";
            greenDot.style.borderRadius = "50%";
            greenDot.style.left = "50%";
            greenDot.style.top = "50%";
            greenDot.style.transform = "translate(-50%, -50%)";

            // Variables for smooth movement
            let x = window.innerWidth / 2; // Start at the center of the screen
            let y = window.innerHeight / 2;
            let angle = Math.random() * 2 * Math.PI; // Random initial direction
            const speed = 2; // Speed of the dot

            // Function to update the green dot's position
            function updatePosition() {
                if (!lol) {
                    
                    finishTests();
                    greenDot.style.display = "none";
                    return;
                }
                // Update x and y based on the angle
                x += speed * Math.cos(angle);
                y += speed * Math.sin(angle);

                // Bounce off walls
                if (x <= 10 || x >= window.innerWidth - 10) {
                    angle = Math.PI - angle; // Reverse direction horizontally
                }
                if (y <= 10 || y >= window.innerHeight - 10) {
                    angle = -angle; // Reverse direction vertically
                }

                // Update the dot's position
                greenDot.style.left = `${x}px`;
                greenDot.style.top = `${y}px`;

                // Request the next animation frame
                requestAnimationFrame(updatePosition);
            }

            function startTest() {
                document.body.appendChild(greenDot);
                updatePosition();

            }


            // Adjust the position if the window is resized
            window.addEventListener("resize", () => {
                x = window.innerWidth / 2;
                y = window.innerHeight / 2;
            });

            setTimeout(() => {
                lol = false;
            }, 25000)

        </script>
    </body>
</html>
