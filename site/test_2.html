<!DOCTYPE html>
    <html>
    <body>

        <script class="test2">
            count = 10;
            greyDot = document.createElement("div");
            greyDot.class = "test2";
            greyDot.style.position = "absolute";
            greyDot.style.width = "20px";
            greyDot.style.height = "20px";
            greyDot.style.backgroundColor = "black";
            greyDot.style.borderRadius = "50%";
            greyDot.style.left = "50%";
            greyDot.style.top = "50%";
            greyDot.style.transform = "translate(-50%, -50%)";

            // Create two green dots (left and right)
            const leftGreenDot = document.createElement("div");
            const rightGreenDot = document.createElement("div");

            [leftGreenDot, rightGreenDot].forEach(dot => {
            dot.style.position = "absolute";
            dot.style.width = "20px";
            dot.classList.add("test2");
            dot.style.height = "20px";
            dot.style.backgroundColor = "darkgray";
            dot.style.borderRadius = "50%";
            });

            // Position the green dots relative to the center grey dot
            leftGreenDot.style.left = "30%";
            leftGreenDot.style.top = "50%";
            leftGreenDot.style.transform = "translate(-50%, -50%)";

            rightGreenDot.style.left = "70%";
            rightGreenDot.style.top = "50%";
            rightGreenDot.style.transform = "translate(-50%, -50%)";

            
            function init() {
                document.body.appendChild(greyDot);
                document.body.appendChild(leftGreenDot);
                document.body.appendChild(rightGreenDot);
            }

            function flashRandomDot() {
                if (count == 0) {
                    finishTests();
                    greyDot.style.display = "none";
                    document.body.removeChild(greyDot);
                    return;
                }
                const dots = [leftGreenDot, rightGreenDot];
                const randomIndex = Math.floor(Math.random() * dots.length);

                // Flash the chosen dot
                const flashingDot = dots[randomIndex];
                flashingDot.style.backgroundColor = "green";

                // Reset the color after 1 second
                setTimeout(() => {flashingDot.style.backgroundColor = "darkgray";}, 1000);
                setTimeout(flashRandomDot, Math.random()*2000+3000);
                count --;
            }
            
            function startTest() {
                init();
                setTimeout(flashRandomDot, 1000);
            }
        </script>
    </body>
</html>
