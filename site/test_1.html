<!DOCTYPE html>
    <html>
        <head>
            <title>ALICE Data Collection Utility</title>
            <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

            <link rel="stylesheet" href="test.css">
            <script src="jquery-3.7.1.min.js" type="text/javascript" ></script>
            <script src="main.js" type="text/javascript" ></script>
        </head>


    <body>
        <div id="canvas"></div>
        <video id="video" autoplay playsinline></video>
        <div id="includedContent"></div>
        <script class="test1">
            times = 1000;
            count = 10;

            function startTest() {
                setTimeout(showGreenDot, 1500);
            }
            greyDot = document.createElement("div");
            greyDot.style.position = "absolute";
            greyDot.class = "test1";
            greyDot.style.width = "20px";
            greyDot.style.height = "20px";
            greyDot.style.backgroundColor = "black";
            greyDot.style.borderRadius = "50%";
            greyDot.style.left = "50%";
            greyDot.style.top = "50%";
            greyDot.style.transform = "translate(-50%, -50%)";
            document.body.appendChild(greyDot);

            greenDot = document.createElement("div");
            greenDot.style.position = "absolute";
            greenDot.class = "test1";
            greenDot.style.width = "20px";
            greenDot.style.height = "20px";
            greenDot.style.backgroundColor = "green";
            greenDot.style.borderRadius = "50%";
            greenDot.style.display = "none";
            document.body.appendChild(greenDot);

            // Function to show and move the green dot
            function showGreenDot() {
                if (count == 0) {
                    finishTests();
                    return;
                }
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;

                // Generate random positions for the green dot
                const randomX = Math.random() * (viewportWidth - 20); // Subtract dot size
                const randomY = Math.random() * (viewportHeight - 20); // Subtract dot size

                // Set the new position of the green dot
                greenDot.style.left = `${randomX}px`;
                greenDot.style.top = `${randomY}px`;

                // Show the green dot
                greenDot.style.display = "block";

                // Hide the green dot after 1 second
                setTimeout(() => {
                    greenDot.style.display = "none";
                }, times);
                times = times - 50;
                setTimeout(showGreenDot, Math.random()*2000+3000);
                count--;
            }

            
            createTest();
            
            document.addEventListener('DOMContentLoaded', () => {startRecording()});
        </script>
        <video id="video" width="320" height="240" autoplay muted></video>
    </body>
</html>
