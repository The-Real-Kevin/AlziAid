<html>
    <link rel="stylesheet" href="css/simple.css">

    <head>
        <link rel="stylesheet" href="css/simple.css">
        <meta charset="UTF-8">
        <title>Testing.</title>
        <style>
        .rounded-rectangle {
            border-radius: 30px;
            padding: 10px;
            margin: 10px;
            padding: 30px;
            background-color: #f2f2f2;
            color: black;
        }
        div {
            width: 120%;
            align-self: center;
            position:relative;
            display:block;
            right:13%
        }
        .tube {
            height: 30px;
            right: 0;
            width: 100%;
            border-radius: 10px;
            background: linear-gradient(to right, red, yellow, green);
            position: relative;
        }
        h3 {
            margin-top: 5px;
        }
        p {
            margin-bottom: 5px;
        }
        .tube::before {
            content: attr(data-value) "%";
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            font-weight: bold;
        }
        .tube::after {
            content: "";
            position: absolute;
            top: 0;
            left: 25%;
            height: 100%;
            width: 2px;
            background-color: white;
        }
        .tube::after {
            content: "";
            position: absolute;
            top: 0;
            left: 65%;
            height: 100%;
            width: 2px;
            background-color: white;
        }
        </style>
        
        <h1>AlziAid | Tracker History</h1>
    </head>
    <body>

    </body> 
    <script>
        const xhr = new XMLHttpRequest();
        xhr.open('GET', './submissions', true);
        xhr.responseType = 'json';
        xhr.onload = function() {
        if (xhr.status === 200) {
            const data = xhr.response;
            const container = document.createElement('div');
            data.forEach(function(item) {
            const roundedRectangle = document.createElement('div');
            roundedRectangle.className = 'rounded-rectangle';

            const date = document.createElement('h3');
            date.textContent = "Date of Testing: " + item.date;

            
            const div = document.createElement('div');
            div.className = "tube";
            div.id = "tube";
            div.setAttribute("data-value", item.perc);

            if (item.perc > 66) {
                f = "Your results indicate that you likely do not have Alzheimer's."
            } else if (item.perc > 25) {
                f = "The results given are not conclusive."
            } else {
                f = "The results indicate that you likely have dementia-related health problems."
            }
            
            const percentage = document.createElement('p');
            percentage.textContent = f;
            roundedRectangle.appendChild(date);
            roundedRectangle.appendChild(div);
            roundedRectangle.appendChild(percentage);

            container.appendChild(roundedRectangle);
            });
            document.body.appendChild(container);
        } else {
            console.log('Error: ' + xhr.status);
        }
        };
        xhr.send();

    </script>
</html>
