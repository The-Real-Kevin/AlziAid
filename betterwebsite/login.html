<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <title>Login</title>
</head>
<body>
    <header>
        <nav>
            <ul class="navlink">
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Diagnostic Record</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li> 
            </ul>
        </nav>
        <a class="cta" href="login.html"><button>Login</button></a>
     </header>

    <div class="wrap">
        <form action="">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder=" Username" required>
   
            </div>
            <div class="input-box">
                <input type="password" placeholder=" Password" required>

            <div class="remember-forgot">
                <br>
                <label><input type="checkbox" style="display: inline-block; justify-content: space-between; font-size: 14.5px; width: auto;"> Remember me </label>
        
           

                
            </div>
            <br>
            <button type="submit" class="btn" style="width: 100%; height:45px; background:rgb(81, 1, 185); border: none; outline: none;">Login</button>

            <div class="register">
                <br>
                <p>Don't have an account? <a href="#"><b>Register</b></a></p>
                <br>
            </div>
        </form>
    </div>
</body>
<script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
